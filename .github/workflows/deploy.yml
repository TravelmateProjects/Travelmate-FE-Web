name: Build and Deploy to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          
      - name: Build application
        run: |
          # Force Vite to rebuild completely without cache
          rm -rf node_modules/.vite
          # Add timestamp to force changes
          echo "// Build: $(date)" >> src/configs/api.ts
          # Check for old IP addresses and replace them
          find src -type f -name "*.ts" -o -name "*.tsx" -o -name "*.js" | xargs grep -l "3.93.248.130" || echo "No old IP found"
          # Build without cache
          npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          VITE_API_BASE_URL: "http://34.207.66.178:5000/"
          
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 20m
          script: |
            echo "🔄 Preparing deployment directory..."
            mkdir -p /mnt/data/Travelmate/deployment-temp
            
      - name: Copy dist directory to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/"
          target: "/mnt/data/Travelmate/deployment-temp"
          overwrite: true
          
      - name: Deploy the built application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 20m
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web
            
            # Pull latest code for other files
            echo "🔄 Pulling latest code..."
            git pull origin master
            
            # Stop old containers
            echo "🧹 Stopping old containers..."
            docker-compose down
            
            # Update the deployment
            echo "🔧 Updating deployment..."
            # Make backup of current dist if it exists
            if [ -d "dist" ]; then
              rm -rf dist.bak
              mv dist dist.bak
            fi
            
            # Replace with new pre-built dist
            cp -r /mnt/data/Travelmate/deployment-temp/dist .
            
            # Update environment variables in docker-compose
            echo "🔧 Updating environment variables..."
            echo "VITE_API_BASE_URL=http://34.207.66.178:5000/" > .env
            
            # Ensure Docker will use pre-built files without rebuilding
            echo "🚀 Starting container with pre-built files..."
            # Force rebuild with no cache
            docker-compose up -d --build --force-recreate
            
            # Clean up
            echo "🧼 Cleaning up..."
            rm -rf /mnt/data/Travelmate/deployment-temp
            docker image prune -f

      - name: Get current time
        id: get_time
        run: echo "time=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Send email notification on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          
          subject: 🥳 Travelmate FE-Web Deployment Successful At ${{ steps.get_time.outputs.time }}
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            🎉 Travelmate FE-Web has been successfully deployed to EC2!

            ➤ Git Branch: master  
            ➤ Docker Compose: Build & Up successful  
            ➤ Time: ${{ github.event.head_commit.timestamp }}
            ➤ Access: http://${{ secrets.EC2_HOST }}:3000
