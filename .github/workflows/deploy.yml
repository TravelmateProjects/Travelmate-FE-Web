name: Deploy to EC2

on:
  push:
    branches:
      - master
  # pull_request:
  #   branches:
  #     - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Reduced timeout for faster feedback

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # Breaking the deployment into smaller steps to avoid timeouts
      - name: SSH - Pull latest code
        uses: appleboy/ssh-action@v1.0.0
        id: ssh_pull
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script_stop: true
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web || exit 1
            git pull origin master

      - name: SSH - Stop old containers
        uses: appleboy/ssh-action@v1.0.0
        id: ssh_stop
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script_stop: false  # Don't stop if failure occurs, keep trying
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web || exit 1
            docker-compose down --timeout 60 || true
            # Force kill any remaining containers if needed
            docker ps | grep travelmate-fe-web | awk '{print $1}' | xargs -r docker kill || true

      - name: SSH - Build and start containers (with resource limits)
        uses: appleboy/ssh-action@v1.0.0
        id: ssh_build
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web || exit 1
            
            # Safeguard: Stop any previous stuck builds
            docker ps -a | grep travelmate-fe-web | awk '{print $1}' | xargs -r docker rm -f || true
            
            # Set environment variables to prevent hanging
            export DOCKER_CLIENT_TIMEOUT=600
            export COMPOSE_HTTP_TIMEOUT=600
            export NODE_OPTIONS="--max-old-space-size=2048"
            
            # Create/update a modified docker-compose override file with resource limits
            cat > docker-compose.override.yml <<EOL
            version: '3'
            services:
              travelmate-fe-web:
                deploy:
                  resources:
                    limits:
                      cpus: '1.5'
                      memory: 2G
                    reservations:
                      cpus: '0.5'
                      memory: 1G
                environment:
                  - NODE_OPTIONS=--max-old-space-size=2048
            EOL
            
            # Start without build first to avoid long-running build process
            if docker images | grep -q travelmate-fe-web; then
              echo "Using existing image first to maintain service..."
              docker-compose up -d --no-build || true
            fi
            
            # Then rebuild in background with nohup to prevent SSH timeout
            echo "Starting build process in background..."
            nohup sh -c "cd /mnt/data/Travelmate/Travelmate-FE-Web && docker-compose build --no-cache && docker-compose up -d" > /tmp/travelmate_build.log 2>&1 &
            BUILD_PID=$!
            
            # Wait for container to be running (max 2 minutes)
            echo "Waiting for container to become available..."
            COUNTER=0
            while [ $COUNTER -lt 24 ]; do
              if docker ps | grep -q "travelmate-fe-web"; then
                echo "✅ Container detected as running!"
                exit 0
              fi
              echo "Still waiting for container... ($COUNTER/24)"
              sleep 5
              COUNTER=$((COUNTER+1))
            done
            
            echo "❌ Container not detected as running within timeout period"
            echo "Current docker processes:"
            docker ps -a
            echo "Last 20 lines of build log:"
            tail -n 20 /tmp/travelmate_build.log
            exit 1
            
      - name: SSH - Clean up
        uses: appleboy/ssh-action@v1.0.0
        id: ssh_cleanup
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web || exit 1
            docker image prune -f

      - name: Check deployment status
        id: check_deployment
        if: always()
        run: |
          if [[ "${{ steps.ssh_build.outcome }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
          
      - name: Retry deployment with emergency measures
        if: steps.check_deployment.outputs.status == 'failure'
        uses: appleboy/ssh-action@v1.0.0
        id: retry_deploy
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web || exit 1
            
            echo "::group::Emergency Cleanup"
            # Check system resources
            echo "System resources:"
            free -h
            df -h
            
            # Kill any stuck processes
            echo "Killing any processes that may be using resources:"
            ps aux | grep -i docker | grep -v grep || true
            docker ps -a | grep travelmate-fe-web | awk '{print $1}' | xargs -r docker rm -f || true
            
            # Cleanup Docker completely if needed
            echo "Cleaning up Docker resources:"
            docker system prune -f || true
            docker volume prune -f || true
            echo "::endgroup::"
            
            echo "::group::Emergency Deployment"
            # Create a simplified emergency Dockerfile if necessary
            cat > Dockerfile.emergency <<EOL
            FROM node:20-alpine as builder
            WORKDIR /app
            COPY package*.json ./
            RUN npm ci --only=production
            COPY . .
            RUN npm run build
            
            FROM nginx:alpine
            COPY --from=builder /app/dist /usr/share/nginx/html
            COPY nginx.conf /etc/nginx/conf.d/default.conf
            EXPOSE 3000
            CMD ["nginx", "-g", "daemon off;"]
            EOL
            
            # Try to build and run emergency container with resource limits
            echo "Building emergency container:"
            docker build -t travelmate-fe-web:emergency -f Dockerfile.emergency . --memory=2g --memory-swap=2g || true
            
            echo "Running emergency container:"
            docker run -d --restart=always --name travelmate-fe-web-emergency -p 3000:3000 --memory=1g --cpus=1.0 travelmate-fe-web:emergency
            echo "::endgroup::"
            
            # Verify deployment success
            echo "Verifying deployment:"
            sleep 15
            if docker ps | grep -q "travelmate-fe-web"; then
              echo "✅ Emergency deployment verified successful!"
              exit 0
            else
              echo "❌ Container not running after emergency deployment"
              # Last resort - Try to use a pre-built image if available
              if docker images | grep -q "travelmate-fe-web"; then
                echo "Attempting last resort with existing image..."
                docker run -d --restart=always --name travelmate-fe-web-last-resort -p 3000:3000 travelmate-fe-web:latest
              fi
              exit 1
            fi

      - name: Get current time
        id: get_time
        run: echo "time=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
            
      - name: Check overall deployment status
        id: check_status
        if: always()
        run: |
          if [[ "${{ steps.ssh_build.outcome }}" == "success" || "${{ steps.retry_deploy.outcome }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
          
      - name: Send email notification on success
        if: steps.check_status.outputs.status == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🥳 Travelmate FE-Web Deployment Successful At ${{ steps.get_time.outputs.time }} 
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            🎉 Travelmate fe-web has been successfully deployed to EC2!

            ➤ Git Branch: master  
            ➤ Docker Compose: Build & Up successful  
            ➤ Time: ${{ github.event.head_commit.timestamp }}
            ➤ Access: http://${{ secrets.EC2_HOST }}:3000
          
      - name: Collect deployment debug information
        if: steps.check_status.outputs.status == 'failure'
        id: debug_info
        continue-on-error: true
        run: |
          echo "timestamp=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "runner=$(uname -a)" >> $GITHUB_OUTPUT

      - name: Send email notification on failure
        if: steps.check_status.outputs.status == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ❌ Travelmate FE-Web Deployment Failed At ${{ steps.get_time.outputs.time }}
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            ❌ Travelmate fe-web deployment to EC2 has failed after multiple attempts!

            ➤ Git Branch: master
            ➤ Commit: ${{ github.sha }}
            ➤ Commit Message: ${{ github.event.head_commit.message }}
            ➤ Time: ${{ github.event.head_commit.timestamp }}
            ➤ Workflow: ${{ github.workflow }}
            ➤ Run ID: ${{ github.run_id }}
            
            📊 Deployment Status:
            - Pull code step: ${{ steps.ssh_pull.outcome }}
            - Stop containers step: ${{ steps.ssh_stop.outcome }}
            - Build step: ${{ steps.ssh_build.outcome }}
            - Retry step: ${{ steps.retry_deploy.outcome }}
            
            🛠️ Troubleshooting Steps:
            1. SSH into the server and check: docker ps -a
            2. Check container logs: docker logs <container_id>
            3. Try manual restart: cd /mnt/data/Travelmate/Travelmate-FE-Web && docker-compose down && docker-compose up -d
            
            View complete workflow logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
  # Watchdog job that runs after the main job completes or times out
  notification-watchdog:
    needs: deploy
    if: always() # This ensures it runs even if the main job times out or fails
    runs-on: ubuntu-latest
    steps:
      - name: Get current time
        id: get_time
        run: echo "time=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
        
      - name: Check if main job timed out or failed
        id: check_job_status
        run: |
          if [[ "${{ needs.deploy.result }}" == "failure" || "${{ needs.deploy.result }}" == "cancelled" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi
          
      - name: Collect server status information
        if: steps.check_job_status.outputs.status == 'failure'
        id: server_check
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 1m
          script: |
            echo "::group::Container Status"
            docker ps -a | grep travelmate-fe-web || echo "No travelmate containers found"
            echo "::endgroup::"
            
            echo "::group::System Load"
            uptime
            free -h
            df -h
            echo "::endgroup::"
            
            echo "::group::Docker Status"
            docker info | grep "Running\|Containers"
            echo "::endgroup::"

      - name: Send timeout notification
        if: steps.check_job_status.outputs.status == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ⏰ Travelmate FE-Web Deployment Timed Out At ${{ steps.get_time.outputs.time }}
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            ⚠️ Travelmate fe-web deployment to EC2 has timed out or was cancelled!

            ➤ Git Branch: master
            ➤ Commit: ${{ github.sha }}
            ➤ Commit Message: ${{ github.event.head_commit.message }}
            ➤ Time: ${{ github.event.head_commit.timestamp }}
            ➤ Workflow: ${{ github.workflow }}
            ➤ Run ID: ${{ github.run_id }}
            ➤ Result: ${{ needs.deploy.result }}
            
            � Timeout Troubleshooting:
            1. SSH into server and check deployment status: docker ps -a
            2. Check for resource constraints: top, free -m, df -h
            3. Look for stuck processes: docker ps -a | grep -i exit
            4. Review docker logs: docker logs <container_id>
            5. Manually complete deployment:
               ```
               cd /mnt/data/Travelmate/Travelmate-FE-Web
               git pull origin master
               docker-compose down
               docker-compose up -d
               ```
            
            After resolving the issue, please consider:
            • Increasing Docker build timeouts
            • Optimizing Docker image size
            • Adding resource limits to containers
            
            View complete workflow logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            