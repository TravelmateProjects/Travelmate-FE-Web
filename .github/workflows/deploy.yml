name: Deploy to EC2

on:
  push:
    branches:
      - master
  # pull_request:
  #   branches:
  #     - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Reduced timeout for faster feedback

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # Breaking the deployment into smaller steps to avoid timeouts
      - name: SSH - Pull latest code
        uses: appleboy/ssh-action@v1.0.0
        id: ssh_pull
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script_stop: true
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web || exit 1
            git pull origin master

      - name: SSH - Stop old containers
        uses: appleboy/ssh-action@v1.0.0
        id: ssh_stop
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script_stop: false  # Don't stop if failure occurs, keep trying
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web || exit 1
            docker-compose down --timeout 60 || true
            # Force kill any remaining containers if needed
            docker ps | grep travelmate-fe-web | awk '{print $1}' | xargs -r docker kill || true

      - name: SSH - Build and start containers (simplified approach)
        uses: appleboy/ssh-action@v1.0.0
        id: ssh_build
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web || exit 1
            
            echo "::group::Cleanup"
            # Stop any previous containers
            docker ps -a | grep travelmate-fe-web | awk '{print $1}' | xargs -r docker rm -f || true
            echo "::endgroup::"
            
            echo "::group::Prepare environment"
            # Set environment variables for Docker and Node.js
            export DOCKER_CLIENT_TIMEOUT=600
            export COMPOSE_HTTP_TIMEOUT=600
            export NODE_OPTIONS="--max-old-space-size=2048"
            
            # We'll use direct Docker commands instead of docker-compose override
            # because of potential YAML formatting issues
            echo "::endgroup::"
            
            echo "::group::Check for existing image"
            # Check if we can reuse an existing image first
            if docker images | grep -q travelmate-fe-web; then
              echo "Found existing image, trying to start it first..."
              docker run -d --name travelmate-fe-web-temp --restart=always \
                --memory=1g --cpus=1.0 -p 3000:3000 \
                -e NODE_OPTIONS="--max-old-space-size=2048" \
                travelmate-fe-web:latest || true
            fi
            echo "::endgroup::"
            
            echo "::group::Start background build"
            # Create a simple build script that will execute in background
            cat > /tmp/build_travelmate.sh <<'EOL'
            #!/bin/bash
            cd /mnt/data/Travelmate/Travelmate-FE-Web
            
            # Build with memory limits
            docker build --memory=2g --memory-swap=2g \
              --build-arg NODE_OPTIONS="--max-old-space-size=2048" \
              -t travelmate-fe-web:latest .
            
            # Stop any container that might be running from earlier steps
            docker ps -a | grep travelmate-fe-web | awk '{print $1}' | xargs -r docker rm -f || true
            
            # Run the new container with resource limits
            docker run -d --name travelmate-fe-web --restart=always \
              --memory=1g --cpus=1.0 -p 3000:3000 \
              -e NODE_OPTIONS="--max-old-space-size=2048" \
              travelmate-fe-web:latest
            
            echo "$(date): Build completed" >> /tmp/travelmate_build.log
            EOL
            
            chmod +x /tmp/build_travelmate.sh
            nohup /tmp/build_travelmate.sh > /tmp/travelmate_build.log 2>&1 &
            echo "Build process started in background with PID: $!"
            echo "::endgroup::"
            
            echo "::group::Wait for container"
            # Wait for container to be running (max 2 minutes)
            echo "Waiting for container to become available..."
            COUNTER=0
            while [ $COUNTER -lt 24 ]; do
              if docker ps | grep -q "travelmate-fe-web"; then
                echo "✅ Container detected as running!"
                exit 0
              fi
              echo "Still waiting for container... ($COUNTER/24)"
              sleep 5
              COUNTER=$((COUNTER+1))
            done
            
            echo "❌ Container not detected as running within timeout period"
            echo "Current docker processes:"
            docker ps -a
            echo "Recent docker build logs:"
            tail -n 30 /tmp/travelmate_build.log
            
            # Check for error patterns in the log
            if grep -q "Error" /tmp/travelmate_build.log; then
              echo "ERROR DETECTED in build logs:"
              grep -A 5 -B 5 "Error" /tmp/travelmate_build.log
            fi
            
            # Check system resources
            echo "System resources:"
            free -m
            df -h
            echo "::endgroup::"
            exit 1
            
      - name: SSH - Clean up
        uses: appleboy/ssh-action@v1.0.0
        id: ssh_cleanup
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web || exit 1
            docker image prune -f

      - name: Check deployment status
        id: check_deployment
        if: always()
        run: |
          if [[ "${{ steps.ssh_build.outcome }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
          
      - name: Retry deployment with emergency measures
        if: steps.check_deployment.outputs.status == 'failure'
        uses: appleboy/ssh-action@v1.0.0
        id: retry_deploy
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web || exit 1
            
            echo "::group::Emergency Cleanup"
            # Check system resources first
            echo "System resources before cleanup:"
            free -h
            df -h
            docker ps -a
            
            # Force kill any Docker processes that might be causing issues
            echo "Force stopping all related containers"
            docker ps -a | grep -i travelmate | awk '{print $1}' | xargs -r docker stop || true
            docker ps -a | grep -i travelmate | awk '{print $1}' | xargs -r docker rm -f || true
            
            # Clean up Docker system
            echo "Pruning Docker system"
            docker system prune -f
            docker volume prune -f
            
            # Check if we have enough disk space
            echo "System resources after cleanup:"
            free -h
            df -h
            echo "::endgroup::"
            
            echo "::group::Minimal Emergency Deploy"
            # Create an extremely minimal container using Nginx only 
            # This will at least give us a "site under maintenance" message
            
            # Create a maintenance page
            mkdir -p /tmp/maintenance-site
            cat > /tmp/maintenance-site/index.html <<'EOL'
            <!DOCTYPE html>
            <html>
            <head>
                <title>Travelmate - Under Maintenance</title>
                <style>
                    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
                    h1 { color: #3498db; }
                    .message { margin: 30px 0; color: #555; }
                </style>
            </head>
            <body>
                <h1>Travelmate</h1>
                <div class="message">
                    <h2>Site Under Maintenance</h2>
                    <p>We're currently updating our services. Please check back shortly.</p>
                    <p>Last update: $(date)</p>
                </div>
            </body>
            </html>
            EOL
            
            # Run a simple nginx container with the maintenance page
            echo "Starting emergency maintenance container"
            docker run -d --name travelmate-fe-web-maintenance \
              --restart=always --memory=256m --cpus=0.5 \
              -p 3000:80 -v /tmp/maintenance-site:/usr/share/nginx/html \
              nginx:alpine
            
            # Check if maintenance site is running
            if docker ps | grep -q "travelmate-fe-web-maintenance"; then
              echo "✅ Emergency maintenance site is running!"
              echo "::endgroup::"
              
              echo "::group::Attempt Background Full Build"
              # Try a full rebuild in the background (won't block the workflow)
              nohup sh -c "cd /mnt/data/Travelmate/Travelmate-FE-Web && \
                docker build --memory=2g --memory-swap=2g --no-cache -t travelmate-fe-web:latest . && \
                docker stop travelmate-fe-web-maintenance && \
                docker run -d --name travelmate-fe-web --restart=always --memory=1g \
                  --cpus=1.0 -p 3000:3000 travelmate-fe-web:latest" > /tmp/emergency_build.log 2>&1 &
              
              echo "Background build started with PID: $!"
              echo "::endgroup::"
              exit 0
            else
              echo "❌ Even emergency maintenance container failed to start"
              echo "::endgroup::"
              
              echo "::group::System Diagnostics"
              echo "Docker info:"
              docker info
              echo "Running processes:"
              ps aux | sort -nrk 3,3 | head -n 15
              echo "Disk usage:"
              df -h
              echo "Memory usage:"
              free -m
              echo "::endgroup::"
              exit 1
            fi

      - name: Get current time
        id: get_time
        run: echo "time=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
            
      - name: Check overall deployment status
        id: check_status
        if: always()
        run: |
          if [[ "${{ steps.ssh_build.outcome }}" == "success" || "${{ steps.retry_deploy.outcome }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
          
      - name: Send email notification on success
        if: steps.check_status.outputs.status == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🥳 Travelmate FE-Web Deployment Successful At ${{ steps.get_time.outputs.time }} 
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            🎉 Travelmate fe-web has been successfully deployed to EC2!

            ➤ Git Branch: master  
            ➤ Docker Compose: Build & Up successful  
            ➤ Time: ${{ github.event.head_commit.timestamp }}
            ➤ Access: http://${{ secrets.EC2_HOST }}:3000
          
      - name: Collect deployment debug information
        if: steps.check_status.outputs.status == 'failure'
        id: debug_info
        continue-on-error: true
        run: |
          echo "timestamp=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "runner=$(uname -a)" >> $GITHUB_OUTPUT

      - name: Send email notification on failure
        if: steps.check_status.outputs.status == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ❌ Travelmate FE-Web Deployment Failed At ${{ steps.get_time.outputs.time }}
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            ❌ Travelmate fe-web deployment to EC2 has failed after multiple attempts!

            ➤ Git Branch: master
            ➤ Commit: ${{ github.sha }}
            ➤ Commit Message: ${{ github.event.head_commit.message }}
            ➤ Time: ${{ github.event.head_commit.timestamp }}
            ➤ Workflow: ${{ github.workflow }}
            ➤ Run ID: ${{ github.run_id }}
            
            📊 Deployment Status:
            - Pull code step: ${{ steps.ssh_pull.outcome }}
            - Stop containers step: ${{ steps.ssh_stop.outcome }}
            - Build step: ${{ steps.ssh_build.outcome }}
            - Retry step: ${{ steps.retry_deploy.outcome }}
            
            🛠️ Troubleshooting Steps:
            1. SSH into the server and check: docker ps -a
            2. Check container logs: docker logs <container_id>
            3. Try manual restart: cd /mnt/data/Travelmate/Travelmate-FE-Web && docker-compose down && docker-compose up -d
            
            View complete workflow logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
  # Watchdog job that runs after the main job completes or times out
  notification-watchdog:
    needs: deploy
    if: always() # This ensures it runs even if the main job times out or fails
    runs-on: ubuntu-latest
    steps:
      - name: Get current time
        id: get_time
        run: echo "time=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
        
      - name: Check if main job timed out or failed
        id: check_job_status
        run: |
          if [[ "${{ needs.deploy.result }}" == "failure" || "${{ needs.deploy.result }}" == "cancelled" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi
          
      - name: Collect server status information
        if: steps.check_job_status.outputs.status == 'failure'
        id: server_check
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 1m
          script: |
            echo "::group::Container Status"
            docker ps -a | grep travelmate-fe-web || echo "No travelmate containers found"
            echo "::endgroup::"
            
            echo "::group::System Load"
            uptime
            free -h
            df -h
            echo "::endgroup::"
            
            echo "::group::Docker Status"
            docker info | grep "Running\|Containers"
            echo "::endgroup::"

      - name: Send timeout notification
        if: steps.check_job_status.outputs.status == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ⏰ Travelmate FE-Web Deployment Timed Out At ${{ steps.get_time.outputs.time }}
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            ⚠️ Travelmate fe-web deployment to EC2 has timed out or was cancelled!

            ➤ Git Branch: master
            ➤ Commit: ${{ github.sha }}
            ➤ Commit Message: ${{ github.event.head_commit.message }}
            ➤ Time: ${{ github.event.head_commit.timestamp }}
            ➤ Workflow: ${{ github.workflow }}
            ➤ Run ID: ${{ github.run_id }}
            ➤ Result: ${{ needs.deploy.result }}
            
            � Timeout Troubleshooting:
            1. SSH into server and check deployment status: docker ps -a
            2. Check for resource constraints: top, free -m, df -h
            3. Look for stuck processes: docker ps -a | grep -i exit
            4. Review docker logs: docker logs <container_id>
            5. Manually complete deployment:
               ```
               cd /mnt/data/Travelmate/Travelmate-FE-Web
               git pull origin master
               docker-compose down
               docker-compose up -d
               ```
            
            After resolving the issue, please consider:
            • Increasing Docker build timeouts
            • Optimizing Docker image size
            • Adding resource limits to containers
            
            View complete workflow logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            