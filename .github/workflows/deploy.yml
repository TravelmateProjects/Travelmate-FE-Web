name: Deploy to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy FE-Web on EC2 with Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30m              # 30 phút
          command_timeout: 20m     # 20 phút
          script: |
            cd /mnt/data/Travelmate/Travelmate-FE-Web

            # Pull latest code
            echo "🔄 Pulling latest code..."
            git pull origin master

            # Stop and remove old containers
            echo "🧹 Stopping old containers..."
            docker-compose down

            # Rebuild and run new containers
            echo "🚀 Building and starting containers..."
            (while true; do echo "⏳ Still building..."; sleep 30; done) & keepalive=$!
            docker-compose up --build -d

            # Rebuild and run new containers
            kill $keepalive

            # Clean up unused images (old versions)
            echo "🧼 Cleaning up old Docker images..."
            docker image prune -f

      - name: Get current time
        id: get_time
        run: echo "time=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Send email notification on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          
          subject: 🥳 Travelmate FE-Web Deployment Successful At ${{ steps.get_time.outputs.time }}
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            🎉 Travelmate FE-Web has been successfully deployed to EC2!

            ➤ Git Branch: master  
            ➤ Docker Compose: Build & Up successful  
            ➤ Time: ${{ github.event.head_commit.timestamp }}
            ➤ Access: http://${{ secrets.EC2_HOST }}:3000
